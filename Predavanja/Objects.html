<script>
    class Die {
        constructor(sides) {
            this.numSides = sides;
            this.numRolls = 0;
        }

        roll() {
            this.numRolls++;
            return Math.floor(Math.random() * this.numSides) + 1;
        }
    }

    let die6 = new Die(6);
    let die8 = new Die(8);

    let roll6 = -1;
    let roll8 = -2;

    while (roll6 !== roll8) {
        roll6 = die6.roll();
        roll8 = die8.roll();

        console.log("6-sided:", roll6, "8-sided:", roll8);
    }

    console.log("Number of rolls:", die6.numRolls);
</script>
