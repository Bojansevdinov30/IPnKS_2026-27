<script>
    /*Задача 4
◼ Напишете JavaScript функција која ќе трансформира објект во
листа од `[key,value]` парови*/
    function key_value_pairs(obj) {
        let keys = _keys(obj);
        let length = keys.length;
        let pairs = Array(length);
        for (let i = 0; i < length; i++) {
            pairs[i] = [keys[i], obj[keys[i]]];
        }
        return pairs;
    }
    function _keys(obj) {
        if (!isObject(obj)) return [];
// return Object.keys(obj);
        let keys = [];
        for (let key in obj) keys.push(key);
        return keys;
    }
    function isObject(obj) {
        let type = typeof obj;
        return type === 'function' || type === 'object' && !!obj;
    }
    console.log(key_value_pairs({red: "#FF0000", green: "#00FF00", white: "#FFFFFF"}));
</script>
<script>
    /*Задача 5
◼ Напишете JavaScript програма која ќе пресметува периметар и
плоштина на круг.
◼ Забелешка: Креирајте два методи за периметар и плоштина.
Радиусот ќе биде даден како влез од корисникот*/
    function circle(radius) {
        this.radius = radius;
        this.area = function () {
            return Math.PI * this.radius * this.radius;
        };
        this.perimeter = function () {
            return 2 * Math.PI * this.radius;
        };
    }
    let c = new circle(3);
    console.log('Area =', c.area().toFixed(2));
    console.log('perimeter =', c.perimeter().toFixed(2));
</script>
