<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Game</title>
    <style>
        .circle {
            border-radius: 100%;
        }

        .square {
            border-radius: 0%;
        }

        .card {
            width: 250px;
            height: 250px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            margin: 10px;
        }

        #gameContainer, #cardContainer {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            width: 450px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px;
        }

        input[type=text] {
            width: 200px;
        }

        select {
            width: 200px;
        }

        label {
            width: 150px;
        }
    </style>
</head>
<body>

<h1>Random Game</h1>

<form id="form">
    <h2>Register Card</h2>

    <div class="row">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name">
    </div>

    <div class="row">
        <label for="code">Code:</label>
        <input type="text" name="code" id="code">
    </div>

    <div class="row">
        <label for="value">Value:</label>
        <input type="text" name="value" id="value">
    </div>

    <div class="row">
        <label for="shape">Shape:</label>
        <select name="shape" id="shape">
            <option value="circle">Circle</option>
            <option value="square">Square</option>
        </select>
    </div>

    <div class="row">
        <label for="color">Color:</label>
        <select name="color" id="color">
            <option value="red">red</option>
            <option value="green">green</option>
            <option value="blue">blue</option>
            <option value="yellow">yellow</option>
            <option value="pink">pink</option>
        </select>
    </div>

    <input type="button" value="Add Card" onclick="addCard()">

    <h2>Game Cards</h2>
    <input type="button" value="Start Game" onclick="startGame()">

    <div id="cardContainer"></div>
</form>

<div id="randomGame" style="display: none">
    <h2>Game Cards</h2>
    <h3>Total cost: <strong id="cost"></strong></h3>
    <div id="gameContainer"></div>
</div>

<script>
    let collection = [];
    let moves = 0;
    let gameStarted = false;

    function addCard() {
        if (gameStarted) {
            return;
        }

        let name = document.getElementById("name").value;
        let code = document.getElementById("code").value;
        let value = document.getElementById("value").value;
        let shape = document.getElementById("shape").value;
        let color = document.getElementById("color").value;

        let cardContainer = document.getElementById("cardContainer");

        if (name == "" || code == "" || value == "" ||
            shape == "" || color == "") {
            alert("Please enter a valid value");
            return;
        }

        code = String(code);
        value = Number(value);

        if (!Number.isFinite(value) || value < 0) {
            alert("Please enter a valid value");
            return;
        }

        for (let i = 0; i < code.length; i++) {
            if (!(code[i] >= 'A' && code[i] <= 'Z')) {
                alert("Please enter a valid code");
                return;
            }
        }

        let card = document.createElement("div");

        card.classList.add("card");
        card.style.backgroundColor = color;
        card.classList.add(shape);

        card.dataset.value = value;

        card.innerHTML = `
            <div class="text">
                <p>Name: ${name}</p>
                <p>Code: ${code}</p>
                <p>Value: ${value}</p>
            </div>
        `;

        cardContainer.appendChild(card);
        collection.push(card);
    }

    function startGame() {
        if (gameStarted || collection.length === 0) {
            return;
        }

        gameStarted = true;

        let gameContainer = document.getElementById("gameContainer");
        let randomGame = document.getElementById("randomGame");
        let form = document.getElementById("form");

        form.style.display = "none";
        randomGame.style.display = "";

        // Shuffle the cards' initial order.
        for (let i = collection.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));

            let temp = collection[i];
            collection[i] = collection[j];
            collection[j] = temp;
        }

        // Generate unique desired positions.
        let positions = [];

        for (let i = 1; i <= collection.length; i++) {
            positions.push(i);
        }

        for (let i = positions.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));

            let temp = positions[i];
            positions[i] = positions[j];
            positions[j] = temp;
        }

        // Assign desired position and shape to every card.
        for (let i = 0; i < collection.length; i++) {
            let card = collection[i];

            card.dataset.desiredPosition = positions[i];

            card.dataset.desiredShape =
                Math.random() < 0.5 ? "circle" : "square";

            let text = card.querySelector(".text");

            text.innerHTML += `
                <p>Position: ${card.dataset.desiredPosition}</p>
                <p>Shape: ${card.dataset.desiredShape}</p>

                <div>
                    <input type="button" value="<"
                        onclick="moveLeft(this)">
                    <input type="button" value=">"
                        onclick="moveRight(this)">
                </div>

                <input type="button" value="Change Shape"
                    onclick="changeShape(this)">
            `;

            gameContainer.appendChild(card);
        }

        updateCost();
    }

    function moveLeft(button) {
        let card = button.closest(".card");
        let i = collection.indexOf(card);

        if (i === 0) {
            return;
        }

        [collection[i - 1], collection[i]] =
            [collection[i], collection[i - 1]];

        moves++;

        let gameContainer = document.getElementById("gameContainer");

        gameContainer.innerHTML = "";

        for (let card of collection) {
            gameContainer.appendChild(card);
        }

        updateCost();
    }

    function moveRight(button) {
        let card = button.closest(".card");
        let i = collection.indexOf(card);

        if (i === collection.length - 1) {
            return;
        }

        [collection[i], collection[i + 1]] =
            [collection[i + 1], collection[i]];

        moves++;

        let gameContainer = document.getElementById("gameContainer");

        gameContainer.innerHTML = "";

        for (let card of collection) {
            gameContainer.appendChild(card);
        }

        updateCost();
    }

    function changeShape(button) {
        let card = button.closest(".card");

        if (card.classList.contains("circle")) {
            card.classList.remove("circle");
            card.classList.add("square");
        } else {
            card.classList.remove("square");
            card.classList.add("circle");
        }

        moves++;

        updateCost();
    }

    function updateCost() {
        let totalErrors = 0;
        let totalValue = 0;
        let allCorrect = true;

        for (let i = 0; i < collection.length; i++) {
            let card = collection[i];

            let currentPosition = i + 1;
            let desiredPosition =
                Number(card.dataset.desiredPosition);

            let positionError =
                Math.abs(desiredPosition - currentPosition) * 50;

            let wrongShape =
                card.classList.contains(card.dataset.desiredShape)
                    ? 0
                    : 1;

            let shapeError = wrongShape * 30;

            totalErrors += positionError + shapeError;
            totalValue += Number(card.dataset.value);

            if (positionError !== 0 || wrongShape !== 0) {
                allCorrect = false;
            }
        }

        let costElement = document.getElementById("cost");

        if (allCorrect) {
            costElement.textContent = totalValue - moves * 10;
        } else {
            costElement.textContent = totalErrors;
        }
    }
</script>

</body>
</html>
