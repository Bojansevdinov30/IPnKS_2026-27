<!--
Да се направи веб страна која при отворање ќе понуди
50 случајно изгенерирани стрингови.

Буквите во стринговите се случајно изгенерирани
(10 поени).

Должината на стрингот е исто случајна
од 3 до 10 карактери.

Секој стринг е поставен во посебен div елемент
кој има случајно изгенерирана боја за позадина
(10 поени).

Со клик на div елементот истиот се преместува
под избраните елементи
(10 поени).

Ако се кликне повторно на истиот div
се враќа назад
(10 поени).

Кога ќе се кликне на копчето "Check"
се прави проверка на избраните стрингови
и треба тие да се избрани по редослед така што:

секој нареден стринг започнува на буквата
на која завршува претходниот стринг
(20 поени).

Ако проверката е успешна
се појавува alert со известување за освоени поени,
каде бројот на поени е вкупниот број на букви
во избраните стрингови
(10 поени).

Ако проверката не е во ред
се појавува alert со информација за грешка
(10 поени).

Процесот на работа на веб страната може да го видите подолу.

Се прикачува еден .html фајл.

Фајлот да биде именуван:
ime_prezime_indeks.html
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    .newDiv{
      display: inline-block;
      margin: 5px;
    }

    body{
      width: 500px;
    }
  </style>
</head>
<body>
<div id="generated">

</div>
<hr>
<div id="clicked">

</div>
<hr>
<button onclick="checkDivs()">
  Check
</button>
<script>
  letters=["A","B","C","D","E","F","G","H","I",
    "G","K","L","M","N","O","P","Q","R","S",
    "T","U","V","W","X","Y","Z",]

  plotter=document.getElementById("generated")
  for (i=0; i<50; i++){
    length=Math.floor(Math.random()*7)+3

    generatedString=""

    for(j=0; j<length; j++){
      generatedString+=
              letters[Math.floor(Math.random()*letters.length)]

    }
    newDiv=document.createElement("div")
    newDiv.innerText=generatedString
    newDiv.style.backgroundColor=getRandomColor()
    newDiv.setAttribute("class","newDiv")
    newDiv.setAttribute("onclick","removeDiv(this)")
    plotter.appendChild(newDiv)
  }
  function getRandomColor(){
    return "#"+Math.floor(Math.random()*255).toString(16)
            +Math.floor(Math.random()*255).toString(16)
            +Math.floor(Math.random()*255).toString(16)
  }
  function removeDiv(div){
    clicked=document.getElementById("clicked")
    div.setAttribute("onclick","removeDivBack(this)")
    clicked.appendChild(div)
  }
  function removeDivBack(div){
    generated=document.getElementById("generated")
    div.setAttribute("onclick","removeDiv(this)")

    generated.appendChild(div)
  }
  function checkDivs(){
    divs=document.getElementById("clicked").childNodes

    counter=0;
    for(i=1; i<divs.length-1; i++){
      firstChar=divs[i].innerText.charAt(divs[i].innerText.length-1)
      secondChar=divs[i+1].innerText.charAt(0)
      counter+=divs[i].innerText.length
      if(firstChar!==secondChar){
        alert("GRESKA...")
        return
      }
    }
    counter+=divs[divs.length-1].innerText.length

    alert("Broj na osvoeni poeni: "+counter)
  }
</script>
</body>
</html>
