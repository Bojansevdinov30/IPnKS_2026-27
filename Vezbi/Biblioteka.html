<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .row {
            margin: 15px;
        }

        label {
            display: inline-block;
            width: 200px;
        }

        table {
            border-collapse: collapse;
        }

        tr, th, td {
            border: 1px solid black;
            padding: 5px;
        }


    </style>
</head>
<body>
<div id="form">
    <div class="row">
        <label for="title">Title: </label>
        <input type="text" id="title">
    </div>
    <div class="row">
        <label for="author">Author: </label>
        <input type="text" id="author">
    </div>
    <div class="row">
        <label for="isbn">ISBN: </label>
        <input type="text" id="isbn">
    </div>
    <div class="row">
        <label for="year">Year: </label>
        <input type="text" id="year">
    </div>
    <div class="row">
        <label for="genre">Genre: </label>
        <select id="genre">
            <option value="fiction">Fiction</option>
            <option value="science">Science</option>
            <option value="history">History</option>
        </select>
    </div>
    <button onclick="addBook()">Add</button>

</div>
<p>Active books: <span id="totalActive">0</span></p>
<div id="tableContainer">
    <table id="table">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
            <th>Genre</th>
            <th>Code</th>
            <th>Actions</th>
        </tr>
    </table>
</div>


<script>

    let active = 0;

    function addBook() {
        let title = document.getElementById("title").value;
        let author = document.getElementById("author").value;
        let isbn = document.getElementById("isbn").value;
        let year = document.getElementById("year").value;
        let genre = document.getElementById("genre").value;

        if (title == "" || author == "" || isbn == "" || year == "" || genre == "") {
            alert("Please fill out the fields");
            return;
        }

        if (!/^[0-9]{13}$/.test(isbn) || document.getElementById(isbn)) {
            alert("Please eneter a valid isbn");
            return;
        }

        if (year.includes(".") || !(year >= "1450" && year <= "2026")) {
            alert("Please enter a valid year");
            return;
        }

        let code = author.slice(0, 3).toUpperCase() + "-" + isbn.slice(9);
        console.log(code);

        let tr = createRow(title, author, isbn, year, genre, code);
        let table = document.getElementById("table");
        table.appendChild(tr);
        updateActive();

    }

    function createRow(title, author, isbn, year, genre, code) {
        let tr = document.createElement("tr");
        tr.id = isbn;
        tr.innerHTML = `<td>${title}</td>
<td>${author}</td>
<td>${year}</td>
<td>${genre}</td>
<td>${code}</td>
<td><button onclick="borrow(this)">Borrow</button></td>`;
        if (genre == "fiction") {
            tr.style.backgroundColor = "lightblue";
        } else if (genre == "science") {
            tr.style.backgroundColor = "lightgreen";
        } else if (genre == "history") {
            tr.style.backgroundColor = "lightyellow";
        }

        active++;

        return tr;
    }

    function borrow(button) {
        let tr = button.parentElement.parentElement;
        active--;
        updateActive();
        tr.style.backgroundColor = "lightgray";
        button.innerText = "Return";
        button.setAttribute("onclick", "returnBook(this)");
    }

    function returnBook(button){
        let tr = button.parentElement.parentElement;
        let genre = tr.children[3].innerHTML;
        active++;
        updateActive();
        if (genre == "fiction") {
            tr.style.backgroundColor = "lightblue";
        } else if (genre == "science") {
            tr.style.backgroundColor = "lightgreen";
        } else if (genre == "history") {
            tr.style.backgroundColor = "lightyellow";
        }
        button.innerText = "Borrow";
        button.setAttribute("onclick", "borrow(this)");
    }

    function updateActive() {
        let totalActive = document.getElementById("totalActive");
        totalActive.innerHTML = String(active);
    }


</script>
</body>
</html>
