<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vezbi 4</title>
    <style>
        .ballsContainer{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ball{
            border-radius: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
            border: 1px solid black;
            padding: 5px;
            min-width: 30px;
            min-height: 30px;
        }
        #cardContainer{
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            min-height: 200px;
        }
        .card{
            min-width: 400px;
            min-height: 300px;
            margin: 10px;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
        }
        #upperDiv{
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        form{
            width: 400px;
            margin-right: 100px;
        }
        .row{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px;
        }
        input[type=text]{
            width: 200px;
        }
        /*select{*/
        /*    width: 200px;*/
        /*}*/
        #addBtn{
            width: 50px;
            margin-left: 160px;
        }
    </style>
</head>
<body>
<h1>National Lottery Game</h1>
<div id="upperDiv">
    <form>
        <h2>Assign Form</h2>
        <div class="row">
            <label for="name">Name and surname: </label>
            <input type="text" id="name">
        </div>
        <div class="row">
            <label for="amount">Ticket Amount: </label>
            <input type="text" id="amount">
        </div>
        <div class="row">
            <label for="code">Code: </label>
            <input type="text" id="code">
        </div>
        <div class="row">
            <label for="combination">Combination: </label>
            <input type="text" id="combination">
        </div>
        <div class="row">
            <label for="bonus">Bonus: </label>
            <select id="bonus">
                <option>Yes</option>
                <option>No</option>
            </select>
        </div>
        <input type="button" value="Add" onclick="addCard()" id="addBtn">
    </form>
    <div id="luckyNumbers">
        <h2>Lucky numbers</h2>
        <div class="luckyContainer">

        </div>
        <input type="button" value="Get Weekly Combination" onclick="getWeeklyCombination()">
        <p>Total win: <span id="total"></span></p>
    </div>
</div>
<div id="cardContainer">

</div>

<script>
    let luckyNumbers = document.getElementById("luckyNumbers");
    let cardContainer = document.getElementById("cardContainer");
    let codes = new Set();
    let cards = [];
    let numbers = [];
    let weekly;
    let total = 0;
    for(let i =1; i<=31; i++){
        numbers.push(i);
    }
    class Card{
        constructor(name, amount, code, combination, bonus){
            this.name = name;
            this.amount = amount;
            this.code = code;
            this.combination = combination;
            this.bonus = bonus;
        }
    }
    function addCard(){
        let name = document.getElementById("name").value;
        let amount = document.getElementById("amount").value;
        let code = document.getElementById("code").value;
        let combination = document.getElementById("combination").value;
        let bonus = document.getElementById("bonus").value;

        if(name == "" || amount == "" || code == "" || combination == "" || bonus == ""){
            alert("Please fill out the form");
            return;
        }

        if(codes.has(code)){
            alert("Code already used");
            return;
        }

        for(let i = 0; i < code.length; i++){
            if(!isNaN(code[i]) || code[i] == "!" || code[i] == "%"){
                alert("Please enter a valid code");
                return;
            }
        }

        amount = Number(amount);
        combination = combination.split(",").map(c => Number(c));
        let card = new Card(name, amount, code, combination, bonus)
        cards.push(card);
        codes.add(code);
        cardContainer.appendChild(makeCard(card))


    }

    function makeCard(card){
        let c = document.createElement("div");
        c.classList.add("card");
        let balls = document.createElement("div");
        balls.classList.add("ballsContainer");
        for(let i = 0; i < card.combination.length; i++){
            let ball = document.createElement("div")
            ball.classList.add("ball");
            ball.innerHTML = card.combination[i];
            balls.appendChild(ball);
        }
        c.innerHTML = `<p>Name: ${card.name}</p>
                       <p>Code: ${card.code}</p>
                       <p class = "balls">Combination:</p>
                       <p>Initial amount: ${card.amount}</p>`;
        c.getElementsByClassName("balls")[0].appendChild(balls);
        c.setAttribute("id", `${card.code}`);
        return c;
    }

    function refreshCards(){
        cardContainer.innerHTML = "";
        for (let i = 0; i < cards.length; i++) {
            cardContainer.appendChild(makeCard(cards[i]));
        }
    }

    function shuffle(array){
        for(let i = array.length-1; i > 0; i--){
            let j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function getPaid(btn){
        let cardDiv = btn.parentElement;
        let card;
        for(let i = 0; i < cards.length; i++){
            if(cardDiv.id == cards[i].code){
                card = cards[i];
                cards.splice(i, 1);
                break;
            }
        }
        let totalContainer = document.getElementById("total");
        total = Number(totalContainer.textContent);
        total -= Number(cardDiv.dataset.totalWin);
        totalContainer.innerHTML = String(total);
        cardContainer.removeChild(cardDiv);
    }

    function getWeeklyCombination(){
        // if(cards.length < 5){
        //     alert("Please enter at least 5 cards");
        //     return;
        // }
        shuffle(numbers);
        weekly = numbers.slice(0, 7);
        let balls = document.createElement("div");
        balls.classList.add("ballsContainer");
        for(let i = 0; i < weekly.length; i++){
            let ball = document.createElement("div")
            ball.classList.add("ball");
            ball.innerHTML = weekly[i];
            ball.style.backgroundColor = getRandomColor();
            balls.appendChild(ball);
        }
        let luckyContainer = luckyNumbers.getElementsByClassName("luckyContainer")[0];
        luckyContainer.innerHTML="";
        luckyContainer.appendChild(balls);

        calculateWin();
    }

    function getRandomColor(){
        return "#" + Math.floor(Math.random()*255).toString(16)
        + Math.floor(Math.random()*255).toString(16)
        + Math.floor(Math.random()*255).toString(16)
    }

    function numberOfCorrect(card){
        let number = 0;
        for(let i = 0; i < card.combination.length; i++){
            for(let j = 0; j < weekly.length; j++){
                if(card.combination[i] == weekly[j]){
                    number++;
                }
            }
        }
        return number;

    }
    function calculateWin(){
        let totalContainer = document.getElementById("total");
        total = 0;
        for(let i = 0; i < cards.length; i++){
            let card = document.getElementById(`${cards[i].code}`);
            if(numberOfCorrect(cards[i]) <= 3){
                card.style.backgroundColor = "yellow";
            }else if(numberOfCorrect(cards[i]) <= 5){
                card.style.backgroundColor = "lightblue";
            }else{
                card.style.backgroundColor = "lightgreen";
            }
            let win = cards[i].amount + numberOfCorrect(cards[i]) * 30;
            if(cards[i].bonus == "Yes"){
                win += 500;
            }
            // if(card.getElementsByTagName("input")){
            //     card.getElementsByClassName(".win")[0].remove();
            //     card.getElementsByTagName("input")[0].remove();
            // }
            card.innerHTML += `<p class="win">Total win: ${win}</p>
                       <input type = "button" value="Get paid" onclick="getPaid(this)">`;
            total+=win;
            card.dataset.totalWin = total;
        }
        totalContainer.innerHTML = String(total);
    }
</script>
</body>
</html>
