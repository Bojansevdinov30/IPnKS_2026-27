<!--Задача 3
Да се напише програма во JavaScript која пресметува волумен на цилиндар (со помош на
класа/прототип)
Волумен на цилиндар = πr2h-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function Cylinder(radius, height) {
        this.radius = radius;
        this.height = height;
    }

    Cylinder.prototype.getVolume = function () {
        return Math.PI * this.radius * this.radius * this.height;
    };
</script>
</body>
</html>
