<!--3. Array of minutes
If minutes >= 10 count
Check for consecutive 10 min in a row
Reset on <10 return 0 if empty/no valid
Return longest 10 min row-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function longestRow(minutes) {
        let count = 0;
        let max = 0;

        for (let i = 0; i < minutes.length; i++) {
            if (minutes[i] >= 10) {
                count++;

                if (count > max) {
                    max = count;
                }
            } else {
                count = 0;
            }
        }

        return max;
    }
</script>
</body>
</html>
