<!--Задача 2
Да се напише функција во JavaScript која како аргумент прима листа и елемент. Функцијата треба да
врати нова листа, каде дадениот елемент е избришан од оригиналната листа:
Пример:
console.log(remove_array_element([2, 5, 9, 6], 5));
[2, 9, 6]-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function removeElement(array, e) {
        // index tuka ne mora, ne se ni koristi
        return array.filter((value, index) => value !== e);
    }
</script>
</body>
</html>
