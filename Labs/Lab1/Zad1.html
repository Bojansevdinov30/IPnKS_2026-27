<!--Да се направи веб страница која за трицифрен број внесен од тастатура (преку prompt) ќе провери
дали е палиндром и ќе испечати соодветна порака на екран. Доколку внесениот број не е
трицифрен треба да се испечати порака дека не може да се провери внесениот број.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1</title>

    <script>
        let str = prompt();

        if (isNaN(parseInt(str))) {
            alert("Not a number")
        } else if (str.length !== 3) {
            alert("Not 3 digits long")
        } else {
            if (str[0] === str[2]) {
                alert("Palindrome");
            } else {
                alert("Not a palindrome");
            }
        }
    </script>
</head>
<body>

</body>
