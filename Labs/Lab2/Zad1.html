<!--Да се направи се напише функцијата removeColor() која во конзола ќе ја испечати тековно-->
<!--селектираната од листата и ќе се избрише од истата.-->
<!DOCTYPE html>
<html>
<head>
    <meta charset=utf-8/>
    <title>Title</title>
    <script>
        function removecolor() {
            let e = document.getElementById("colorSelect");

            console.log(e.options[e.selectedIndex].value);

            e.options[e.selectedIndex].remove();
        }
    </script>
</head>
<body>
<form>
    <select id="colorSelect">
        <option>Red</option>
        <option>Green</option>
        <option>White</option>
        <option>Black</option>
    </select>
    <input type="button" onclick="removecolor()" value="Select and Remove"><br></form>
</body>
</html>
