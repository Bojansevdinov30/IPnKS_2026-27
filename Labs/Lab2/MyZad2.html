<!--Slug за URL-адреса / URL slug

МК

Блоговите и веб-продавниците од насловот на секоја статија прават краток дел од URL-адресата, т.н. slug. На пример, статијата „Internet Programming: Lab 2!“
би имала адреса што завршува на /internet-programming-lab-2.

Напишете ја функцијата toSlug(title) која го враќа slug-от за дадениот наслов според следниве правила:

сите букви се претвораат во мали;
латиничните букви (a–z) и цифрите (0–9) се задржуваат;
секоја група од еден или повеќе други знаци што се појавуваат последователно (празни места, интерпункциски знаци и сл.) се заменува со една цртичка -;
резултатот не смее ниту да започнува ниту да завршува со цртичка.

Ако насловот не содржи ниту една буква или цифра, функцијата враќа празен стринг "".

Помош: прво претворете го насловот во мали букви со toLowerCase(), а потоа изминете го знак по знак. Размислете кога точно треба да се додаде цртичката.

Во полето за одговор е дадена HTML-страница со функцијата. Напишете го телото на функцијата; може да додадете и помошни функции. Функцијата не чита влезни
податоци со prompt и не прикажува пораки со alert, туку само го враќа резултатот со return. Копчето Check ја проверува функцијата со 5 теста, секој носи 0,2
поени.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<input type = "button" value = "click me" onclick="toSlug('Internet Programming: Lab 2!')">
<script>
    function toSlug(title){
        title = title.toLowerCase();
        title = title.replace(/[^A-Za-z0-9]+/g, "-")
        while(title[0] == "-"){
            title = title.slice(1);
        }
        while(title.endsWith("-")){
            title = title.slice(0, title.length-1);
        }
        title = "/" + title;
        document.body.appendChild(document.createTextNode(title));
        return title;
    }
    // bez regex
    function toSlug2(title) {
        title = title.toLowerCase();

        let result = "";
        let lastWasSeparator = false;

        for (let i = 0; i < title.length; i++) {
            let ch = title[i];

            if ((ch >= "a" && ch <= "z") || (ch >= "0" && ch <= "9")) {
                result += ch;
                lastWasSeparator = false;
            }
            else {
                if (result.length > 0 && !lastWasSeparator) {
                    result += "-";
                    lastWasSeparator = true;
                }
            }
        }

        if (result.endsWith("-")) {
            result = result.slice(0, -1);
        }

        return result;
    }
</script>
</body>
</html>
